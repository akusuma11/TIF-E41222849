  path_provider: ^2.1.4

  # Multimedia & Interactivity
  audioplayers: ^6.1.0
  confetti: ^0.8.0

  # Image Processing
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.19.0
  fluttertoast: ^8.2.8
  logger: ^2.4.0
  flutter_pdfview: ^1.4.0
  syncfusion_flutter_pdfviewer: ^29.1.35
  flutter_tts: 4.0.2
  google_speech: ^5.3.0
  cloud_text_to_speech: ^1.1.3
  gal: ^2.3.2

#  helper_animation:
#    git:
#      url: https://github.com/Greek-Cp/helper_animation.git
#      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  isar_community_generator: ^3.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/books/others/
    - assets/images/